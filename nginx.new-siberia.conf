# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name new-siberia.center www.new-siberia.center 77.91.112.115;

    location /.well-known/acme-challenge/ {
        root /var/www/new-siberia/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex canonical redirect
server {
    listen 443 ssl;
    server_name www.new-siberia.center;

    ssl_certificate /etc/letsencrypt/live/new-siberia.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new-siberia.center/privkey.pem;

    return 301 https://new-siberia.center$request_uri;
}

server {
    listen 443 ssl;
    server_name new-siberia.center;

    ssl_certificate /etc/letsencrypt/live/new-siberia.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new-siberia.center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Gzip compression (Cloudflare also compresses on the edge; this covers origin)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/xml+rss text/javascript;

    root /var/www/new-siberia;

    location /static/ {
        alias /var/www/new-siberia/static/;
    }

    location /uploads/ {
        alias /var/www/new-siberia/static/uploads/;
    }

    location /assets/ {
        alias /var/www/new-siberia/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.svg {
        alias /var/www/new-siberia/dist/favicon.svg;
    }

    location = /hero.jpg {
        alias /var/www/new-siberia/dist/hero.jpg;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA + server-rendered pages (/, /services/<slug>, /sitemap.xml, /robots.txt)
    # proxied to Flask/Gunicorn so it can inject per-page SEO meta.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
